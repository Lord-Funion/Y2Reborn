name: 💡 Feature request
description: Something new the player should do, or something it should do differently.
labels: [enhancement]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you send this
      description: "The same thing may have been reported or asked already. Please look through the [Y2Linux issues](https://github.com/SchulzCode/Y2Linux/issues?q=is%3Aissue), the [Y2Reborn issues](https://github.com/SchulzCode/Y2Reborn/issues?q=is%3Aissue) (open and closed) and the [ideas that won't be built](https://github.com/SchulzCode/Y2Linux/blob/main/docs/NOT-PLANNED.md). If it is there, add to that issue instead."
      options:
        - label: I searched, and this isn't there yet.
          required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: e.g. A "Recently Added" place on Home.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What you want to do with it. This helps find the best way, which may be different from the first idea.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where would you look for it?
      description: Which menu or page you'd expect it in, or a sketch.
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → System → About
      placeholder: e.g. 1.0 Beta 9.2.13
