name: ❓ Question
description: How do I…? Is it normal that…? Will the player support…?
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → System → About, if you have Y2Linux installed.
      placeholder: e.g. 1.0 Beta 9.2.13
