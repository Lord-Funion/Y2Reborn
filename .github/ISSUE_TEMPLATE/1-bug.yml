name: 🐞 Something works wrong
description: A crash, a freeze, an error message, or the player does the wrong thing.
labels: [bug]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you send this
      description: "The same thing may have been reported or asked already. Please look through the [Y2Linux issues](https://github.com/SchulzCode/Y2Linux/issues?q=is%3Aissue), the [Y2Reborn issues](https://github.com/SchulzCode/Y2Reborn/issues?q=is%3Aissue) (open and closed) and the [ideas that won't be built](https://github.com/SchulzCode/Y2Linux/blob/main/docs/NOT-PLANNED.md). If it is there, add to that issue instead."
      options:
        - label: I searched, and this isn't there yet.
          required: true
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! These answers let the maintainer find the cause without asking back.
        Wrong form? Go back and pick another; Y2Linux or Y2Reborn are both fine, the maintainer moves issues where they belong.
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → System → About
      placeholder: e.g. 1.0 Beta 9.2.13
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: e.g. Choosing a playlist shows "Couldn't play" instead of playing it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from a known state, e.g. after a restart.
      placeholder: |
        1. Restart the player
        2. Open Music → Playlists → Road Trip
        3. Press Play
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - Only once so far
    validations:
      required: true
  - type: dropdown
    id: since
    attributes:
      label: Since when?
      options:
        - It always did this
        - Since an update (say which below)
        - I don't know
    validations:
      required: true
  - type: input
    id: report
    attributes:
      label: Error report
      description: |
        Right after it happens: Settings → System → Error Reports → **Send Report Now**, then paste the **Install ID**
        shown on that page. Without Wi-Fi: **Save Report** and attach the file from the *Error Reports* folder under
        "Anything else". Reports hold no song titles, file names, Wi-Fi names or passwords
        ([what is in a report](https://github.com/SchulzCode/Y2Linux/blob/main/docs/ERROR-REPORTS.md)).
      placeholder: Install ID, "attached", or why not (e.g. the player won't start)
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Photos or a short video of the screen help a lot. Drag files (and a saved report) in here.
