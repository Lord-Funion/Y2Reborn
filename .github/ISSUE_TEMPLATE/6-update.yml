name: 📦 Install, start or update
description: Installing Y2Linux, adding the Wi-Fi/Bluetooth firmware, an update or going back to stock failed, or the player says "Couldn't Start".
labels: [update]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you send this
      description: "The same thing may have been reported or asked already. Please look through the [Y2Linux issues](https://github.com/SchulzCode/Y2Linux/issues?q=is%3Aissue), the [Y2Reborn issues](https://github.com/SchulzCode/Y2Reborn/issues?q=is%3Aissue) (open and closed) and the [ideas that won't be built](https://github.com/SchulzCode/Y2Linux/blob/main/docs/NOT-PLANNED.md). If it is there, add to that issue instead."
      options:
        - label: I searched, and this isn't there yet.
          required: true
  - type: markdown
    attributes:
      value: |
        Please say exactly where it stopped; a photo of the screen helps most.
        Wrong form? Go back and pick another; Y2Linux or Y2Reborn are both fine, the maintainer moves issues where they belong.
  - type: dropdown
    id: how
    attributes:
      label: What were you doing?
      options:
        - First install
        - Adding the Wi-Fi and Bluetooth firmware (system.img)
        - Update on the player (Software Update)
        - Going back to stock
        - Nothing; the player stopped starting by itself
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: How did you install Y2Linux?
      description: The first install, even if the problem came later.
      options:
        - SP Flash Tool with the first-install zip from GitHub
        - Innioasis Updater (Updater CE)
        - Another way (say which below)
        - I don't know
    validations:
      required: true
  - type: dropdown
    id: stock_first
    attributes:
      label: Did you flash the Innioasis stock firmware right before installing Y2Linux?
      options:
        - "No"
        - Yes, with SP Flash Tool, Download Only
        - Yes, with SP Flash Tool, Format All + Download or Firmware Upgrade
        - Yes, with the Innioasis Updater (Updater CE)
        - I don't know
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Which files and versions?
      description: The Y2Linux file you installed, and the version before and after for an update.
      placeholder: e.g. Y2Linux-1.0.0-beta.9.3.22-first-install.zip, stock 3.2.0 before / Beta 9.3.21 → Beta 9.3.22
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer and tool version
      description: For a first install or going back to stock. "None" for an update on the player.
      placeholder: e.g. Windows 11, SP Flash Tool v5.2032 / macOS 15, Updater CE 1.4 / None
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Where did it stop, and what did the screen show?
      description: Step by step what you did, and the last thing the tool and the player showed.
      placeholder: |
        1. Flashed the four rows with Download Only, SP Flash Tool showed "Download OK"
        2. Pressed Power: "Setting up storage", then "Couldn't Start"
    validations:
      required: true
  - type: dropdown
    id: now
    attributes:
      label: Does the player start now?
      options:
        - Yes, normally
        - Yes, but into the old version
        - No, it says "Couldn't Start"
        - No, it shows a rescue screen with a reason
        - No, only a logo or a black screen
    validations:
      required: true
  - type: dropdown
    id: sd
    attributes:
      label: Is an SD card in the player?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: input
    id: report
    attributes:
      label: Error report
      description: |
        If the player starts: Settings → System → Error Reports → **Send Report Now**, then paste the **Install ID**
        shown on that page. If it says "Couldn't Start", it saved a report itself: connect it to a computer (it
        still shows up as a USB drive) and attach the file from *Internal Storage* (or *SD Card*) → *Error Reports*
        under "Anything else". Reports hold no song titles, file names, Wi-Fi names or passwords
        ([what is in a report](https://github.com/SchulzCode/Y2Linux/blob/main/docs/ERROR-REPORTS.md)).
      placeholder: Install ID, "attached", or why not (e.g. only a black screen)
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Photos or a short video of the screen help a lot. Drag files (and a saved report) in here.
